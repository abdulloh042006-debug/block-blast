<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1228">
<title>Gridbloom</title>
<style>
  :root { --bg1:#222a52; --bg2:#0f1228; --text:#eef1ff; --dim:#9aa3d6; --accent:#ffd43b; --panel:#1b2042; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg2)); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none;
         display: flex; flex-direction: column; align-items: center; user-select: none; -webkit-user-select: none; }
  .app { width: 100%; max-width: 560px; height: 100%; display: flex; flex-direction: column;
         padding: max(10px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 4px 10px; }
  .stat { min-width: 0; }
  .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
  .num { font-size: 34px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .best .num { font-size: 22px; color: var(--accent); }
  .brand { font-weight: 800; letter-spacing: .02em; font-size: 15px; color: var(--dim); }
  .icon { width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--panel); color: var(--text); display: grid; place-items: center; cursor: pointer; }
  .icon:focus-visible, .btn:focus-visible, .skin:focus-visible, .switch:focus-visible, canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  main { flex: 1; min-height: 0; display: flex; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; border-radius: 16px; outline-offset: -3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .dlg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(5,6,20,.55); z-index: 5; }
  .dlg.show { display: flex; animation: fade .18s ease-out; }
  .card { width: min(380px, 100%); background: var(--panel); border-radius: 22px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.45); text-align: center; animation: pop .22s ease-out; }
  .card h2 { margin: 0 0 4px; font-size: 22px; }
  .big { font-size: 56px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
  .muted { color: var(--dim); } .badge { display: inline-block; background: var(--accent); color: #1a1a1a; font-weight: 800; padding: 2px 12px; border-radius: 99px; }
  .stack { display: grid; gap: 10px; margin-top: 18px; }
  .btn { border: 0; border-radius: 14px; padding: 14px 18px; font: inherit; font-weight: 800; cursor: pointer; background: color-mix(in srgb, var(--text) 12%, transparent); color: var(--text); min-height: 48px; }
  .btn.primary { background: var(--accent); color: #1a1a1a; }
  .btn[hidden] { display: none; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px; text-align: left; }
  .row[hidden] { display: none; }
  .switch { width: 54px; height: 32px; border-radius: 99px; border: 0; background: color-mix(in srgb, var(--text) 22%, transparent); position: relative; cursor: pointer; flex: none; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--text); transition: transform .15s; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(22px); background: #1a1a1a; }
  #skins { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .skin { display: flex; align-items: center; gap: 10px; border: 2px solid transparent; border-radius: 12px; padding: 10px; font: inherit; font-weight: 700; color: var(--text); background: color-mix(in srgb, var(--text) 10%, transparent); cursor: pointer; }
  .skin.on { border-color: var(--accent); }
  .sw { width: 22px; height: 22px; border-radius: 7px; flex: none; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes pop { from { transform: scale(.94); opacity: 0 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .dlg.show, .card { animation: none; } .switch::after { transition: none; } }
  @media (max-height: 560px) { .num { font-size: 26px; } .best .num { font-size: 18px; } header { padding-bottom: 4px; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="stat"><div class="label">Score</div><div class="num" id="score">0</div></div>
    <div class="brand" aria-hidden="true">Gridbloom</div>
    <div class="stat best" style="text-align:right"><div class="label">Best</div><div class="num" id="best">0</div></div>
    <button class="icon" id="menu" aria-label="Settings" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>
  <main><canvas id="stage" tabindex="0" aria-label="Game board. Drag a piece from the tray onto the 8 by 8 grid."></canvas></main>
  <div class="sr" id="live" aria-live="polite"></div>
</div>

<div class="dlg" id="over" role="dialog" aria-modal="true" aria-labelledby="overTitle" aria-hidden="true">
  <div class="card">
    <h2 id="overTitle">No moves left</h2>
    <div class="big" id="overScore">0</div>
    <div id="overBest" class="muted">Best 0</div>
    <div class="muted" id="overStats" style="margin-top:6px;font-size:14px"></div>
    <div class="stack">
      <button class="btn primary" id="again" type="button">Play again</button>
      <button class="btn" id="rescue" type="button" hidden>Second chance</button>
    </div>
  </div>
</div>

<div class="dlg" id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle" aria-hidden="true">
  <div class="card">
    <h2 id="setTitle">Settings</h2>
    <div class="row"><span>Sound</span><button class="switch" id="optSound" role="switch" aria-checked="true" aria-label="Sound" type="button"></button></div>
    <div class="row" id="rowHaptics"><span>Vibration</span><button class="switch" id="optHaptics" role="switch" aria-checked="true" aria-label="Vibration" type="button"></button></div>
    <div class="row" style="padding-bottom:0"><span>Theme</span></div>
    <div id="skins"></div>
    <div class="stack">
      <button class="btn" id="restart" type="button">New game</button>
      <button class="btn" id="resetBest" type="button">Reset best score</button>
      <button class="btn" id="privacy" type="button" hidden>Privacy</button>
      <button class="btn primary" id="closeSet" type="button">Back to game</button>
    </div>
  </div>
</div>

<script>
/* Gridbloom engine: pure rules, no DOM, no clock. UMD so Node tests and the browser share it. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.GB = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var SIZE = 8;
  var CELLS = SIZE * SIZE;
  var TRAY = 3;
  var COMBO_GRACE = 3;
  var ALL_CLEAR_BONUS = 300;
  var SAVE_VERSION = 1;
  var MAX_RESCUES = 1;

  // ---------- shapes (ASCII, '#' = filled) ----------
  var RAW = {
    dot: ['#'],
    h2: ['##'], v2: ['#', '#'],
    h3: ['###'], v3: ['#', '#', '#'],
    h4: ['####'], v4: ['#', '#', '#', '#'],
    h5: ['#####'], v5: ['#', '#', '#', '#', '#'],
    sq2: ['##', '##'],
    sq3: ['###', '###', '###'],
    r23: ['###', '###'], r32: ['##', '##', '##'],
    // small L (3 cells), 4 rotations
    l3a: ['#.', '##'], l3b: ['.#', '##'], l3c: ['##', '#.'], l3d: ['##', '.#'],
    // big L (5 cells), 4 rotations
    l5a: ['#..', '#..', '###'], l5b: ['..#', '..#', '###'],
    l5c: ['###', '#..', '#..'], l5d: ['###', '..#', '..#'],
    // L tetromino, both hands, 4 rotations each
    lt1: ['#.', '#.', '##'], lt2: ['.#', '.#', '##'],
    lt3: ['##', '#.', '#.'], lt4: ['##', '.#', '.#'],
    lt5: ['###', '#..'], lt6: ['###', '..#'],
    lt7: ['#..', '###'], lt8: ['..#', '###'],
    // T tetromino, 4 rotations
    t1: ['###', '.#.'], t2: ['.#.', '###'], t3: ['#.', '##', '#.'], t4: ['.#', '##', '.#'],
    // S / Z
    s1: ['.##', '##.'], z1: ['##.', '.##'], s2: ['#.', '##', '.#'], z2: ['.#', '##', '#.']
  };

  // weight class: 0 easy, 1 medium, 2 hard (hard pieces grow more likely as score rises)
  var CLASS = {
    dot: 0, h2: 0, v2: 0, l3a: 0, l3b: 0, l3c: 0, l3d: 0, sq2: 0, h3: 0, v3: 0,
    h4: 1, v4: 1, r23: 1, r32: 1, lt1: 1, lt2: 1, lt3: 1, lt4: 1, lt5: 1, lt6: 1, lt7: 1, lt8: 1,
    t1: 1, t2: 1, t3: 1, t4: 1, s1: 1, z1: 1, s2: 1, z2: 1,
    h5: 2, v5: 2, sq3: 2, l5a: 2, l5b: 2, l5c: 2, l5d: 2
  };
  var SMALL_IDS = ['dot', 'h2', 'v2', 'sq2', 'l3a', 'l3b', 'l3c', 'l3d'];

  var SHAPES = {};
  var SHAPE_IDS = [];
  Object.keys(RAW).forEach(function (id, i) {
    var rows = RAW[id], cells = [];
    for (var r = 0; r < rows.length; r++)
      for (var c = 0; c < rows[r].length; c++)
        if (rows[r][c] === '#') cells.push([r, c]);
    SHAPES[id] = {
      id: id, cells: cells, h: rows.length, w: rows[0].length,
      size: cells.length, cls: CLASS[id], color: (i % 7) + 1
    };
    SHAPE_IDS.push(id);
  });
  var COLOR_COUNT = 7;

  // ---------- seeded rng (mulberry32, state is one integer so it can be saved) ----------
  function Rng(seed) { this.s = (seed >>> 0) || 1; }
  Rng.prototype.next = function () {
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    var t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  Rng.prototype.int = function (n) { return Math.floor(this.next() * n); };

  // ---------- board helpers (board = Uint8Array(64), 0 empty, 1..7 colour) ----------
  function emptyBoard() { return new Uint8Array(CELLS); }

  function canPlace(board, shape, r0, c0) {
    for (var i = 0; i < shape.cells.length; i++) {
      var r = r0 + shape.cells[i][0], c = c0 + shape.cells[i][1];
      if (r < 0 || c < 0 || r >= SIZE || c >= SIZE) return false;
      if (board[r * SIZE + c] !== 0) return false;
    }
    return true;
  }

  function placements(board, shape) {
    var out = [];
    for (var r = 0; r <= SIZE - shape.h; r++)
      for (var c = 0; c <= SIZE - shape.w; c++)
        if (canPlace(board, shape, r, c)) out.push([r, c]);
    return out;
  }

  function canPlaceAnywhere(board, shape) {
    for (var r = 0; r <= SIZE - shape.h; r++)
      for (var c = 0; c <= SIZE - shape.w; c++)
        if (canPlace(board, shape, r, c)) return true;
    return false;
  }

  // Which rows/cols would be full after placing (no mutation). Used for the preview.
  function previewClears(board, shape, r0, c0) {
    var tmp = board.slice();
    for (var i = 0; i < shape.cells.length; i++)
      tmp[(r0 + shape.cells[i][0]) * SIZE + (c0 + shape.cells[i][1])] = shape.color;
    return fullLines(tmp);
  }

  function fullLines(b) {
    var rows = [], cols = [], r, c, ok;
    for (r = 0; r < SIZE; r++) {
      ok = true;
      for (c = 0; c < SIZE; c++) if (b[r * SIZE + c] === 0) { ok = false; break; }
      if (ok) rows.push(r);
    }
    for (c = 0; c < SIZE; c++) {
      ok = true;
      for (r = 0; r < SIZE; r++) if (b[r * SIZE + c] === 0) { ok = false; break; }
      if (ok) cols.push(c);
    }
    return { rows: rows, cols: cols };
  }

  // Place a shape and clear every full row and column at once.
  function placeAndClear(board, shape, r0, c0) {
    var b = board.slice(), i;
    for (i = 0; i < shape.cells.length; i++)
      b[(r0 + shape.cells[i][0]) * SIZE + (c0 + shape.cells[i][1])] = shape.color;
    var lines = fullLines(b);
    var cleared = []; // [index, colour] so the UI can animate what vanished
    var seen = {};
    function wipe(idx) {
      if (seen[idx]) return;
      seen[idx] = true;
      cleared.push([idx, b[idx]]);
    }
    var r, c;
    lines.rows.forEach(function (row) { for (c = 0; c < SIZE; c++) wipe(row * SIZE + c); });
    lines.cols.forEach(function (col) { for (r = 0; r < SIZE; r++) wipe(r * SIZE + col); });
    cleared.forEach(function (e) { b[e[0]] = 0; });
    var empty = true;
    for (i = 0; i < CELLS; i++) if (b[i] !== 0) { empty = false; break; }
    return {
      board: b, rows: lines.rows, cols: lines.cols,
      lines: lines.rows.length + lines.cols.length,
      cleared: cleared, allClear: empty
    };
  }

  // ---------- scoring ----------
  function lineBase(n) { return n <= 0 ? 0 : (10 * n * (n + 1)) / 2; }

  function scorePlacement(cells, lines, allClear, streak, since) {
    if (lines === 0) {
      var s = since + 1;
      return {
        placement: cells, line: 0, combo: 0, allClear: 0,
        streak: s >= COMBO_GRACE ? 0 : streak, since: s,
        total: cells
      };
    }
    var ns = streak + 1;
    var line = lineBase(lines);
    var combo = ns >= 2 ? (ns - 1) * 10 * lines : 0;
    var ac = allClear ? ALL_CLEAR_BONUS : 0;
    return {
      placement: cells, line: line, combo: combo, allClear: ac,
      streak: ns, since: 0, total: cells + line + combo + ac
    };
  }

  // ---------- generator ----------
  function weightFor(shape, score) {
    var t = Math.min(1, score / 4000); // difficulty ramp 0..1
    var base = shape.cls === 0 ? 1.0 - 0.4 * t : shape.cls === 1 ? 1.0 : 0.35 + 0.9 * t;
    return base;
  }

  function pickShape(rng, score, pool) {
    var ids = pool || SHAPE_IDS, total = 0, ws = [], i;
    for (i = 0; i < ids.length; i++) { var w = weightFor(SHAPES[ids[i]], score); ws.push(w); total += w; }
    var x = rng.next() * total;
    for (i = 0; i < ids.length; i++) { x -= ws[i]; if (x <= 0) return ids[i]; }
    return ids[ids.length - 1];
  }

  // Is there some order of the tray where every piece can be placed in turn? (clears simulated)
  // The search has a node budget; if it runs out we give the tray the benefit of the doubt.
  function solvable(board, trayIds, budget) {
    var nodes = { n: budget || 12000 };
    var pieces = trayIds.filter(Boolean).map(function (id) { return SHAPES[id]; });
    if (pieces.length === 0) return true;

    function dfs(b, remaining) {
      if (remaining.length === 0) return true;
      if (nodes.n <= 0) return true;
      for (var i = 0; i < remaining.length; i++) {
        var sh = remaining[i];
        var rest = remaining.slice(0, i).concat(remaining.slice(i + 1));
        for (var r = 0; r <= SIZE - sh.h; r++) {
          for (var c = 0; c <= SIZE - sh.w; c++) {
            if (!canPlace(b, sh, r, c)) continue;
            nodes.n--;
            if (nodes.n <= 0) return true;
            var out = placeAndClear(b, sh, r, c);
            if (dfs(out.board, rest)) return true;
          }
        }
      }
      return false;
    }
    return dfs(board, pieces);
  }

  function nextTray(rng, board, score) {
    var tries = 40, best = null, i, j;
    for (i = 0; i < tries; i++) {
      var tray = [];
      for (j = 0; j < TRAY; j++) tray.push(pickShape(rng, score));
      var allFit = tray.every(function (id) { return canPlaceAnywhere(board, SHAPES[id]); });
      if (!allFit) continue;
      if (solvable(board, tray)) return tray;
      if (!best) best = tray;
    }
    if (best) return best;
    // Fallback: small pieces only, and prefer ones that fit.
    var small = [];
    for (j = 0; j < TRAY; j++) small.push(pickShape(rng, 0, SMALL_IDS));
    return small;
  }

  function hasAnyMove(board, tray) {
    for (var i = 0; i < tray.length; i++)
      if (tray[i] && canPlaceAnywhere(board, SHAPES[tray[i]])) return true;
    return false;
  }

  // ---------- game ----------
  function Game(seed) { this.newGame(seed); }

  Game.prototype.newGame = function (seed) {
    if (seed === undefined) seed = (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
    this.seed = seed >>> 0;
    this.rng = new Rng(this.seed);
    this.board = emptyBoard();
    this.score = 0;
    this.streak = 0;
    this.since = 0;
    this.rescues = 0;
    this.over = false;
    this.moves = 0;
    this.linesTotal = 0;
    this.tray = nextTray(this.rng, this.board, 0);
  };

  // submit(trayIndex, row, col) -> result. Never throws on bad input; returns ok:false with a reason.
  Game.prototype.submit = function (index, r, c) {
    if (this.over) return { ok: false, reason: 'over' };
    if (!(index >= 0 && index < TRAY) || !this.tray[index]) return { ok: false, reason: 'no-piece' };
    var shape = SHAPES[this.tray[index]];
    if (!canPlace(this.board, shape, r, c)) return { ok: false, reason: 'blocked' };

    var out = placeAndClear(this.board, shape, r, c);
    var sc = scorePlacement(shape.size, out.lines, out.allClear, this.streak, this.since);
    this.board = out.board;
    this.score += sc.total;
    this.streak = sc.streak;
    this.since = sc.since;
    this.moves++;
    this.linesTotal += out.lines;
    this.tray[index] = null;

    var newTray = false;
    if (this.tray.every(function (t) { return t === null; })) {
      this.tray = nextTray(this.rng, this.board, this.score);
      newTray = true;
    }
    this.over = !hasAnyMove(this.board, this.tray);
    return {
      ok: true, shape: shape, row: r, col: c, rows: out.rows, cols: out.cols,
      lines: out.lines, cleared: out.cleared, allClear: out.allClear,
      score: sc, newTray: newTray, over: this.over
    };
  };

  Game.prototype.canRescue = function () { return this.over && this.rescues < MAX_RESCUES; };

  // Clear the central 4x4 block and deal three small pieces. Returns false if not allowed.
  Game.prototype.rescue = function () {
    if (!this.canRescue()) return false;
    for (var r = 2; r <= 5; r++) for (var c = 2; c <= 5; c++) this.board[r * SIZE + c] = 0;
    var t = [];
    for (var i = 0; i < TRAY; i++) t.push(pickShape(this.rng, 0, SMALL_IDS));
    this.tray = t;
    this.rescues++;
    this.over = !hasAnyMove(this.board, this.tray);
    return true;
  };

  Game.prototype.serialize = function () {
    return JSON.stringify({
      v: SAVE_VERSION, seed: this.seed, rng: this.rng.s, board: Array.prototype.slice.call(this.board),
      tray: this.tray, score: this.score, streak: this.streak, since: this.since,
      rescues: this.rescues, over: this.over, moves: this.moves, lines: this.linesTotal
    });
  };

  // Returns a Game, or null if the data is missing, old or damaged. Never throws.
  Game.restore = function (json) {
    try {
      var d = typeof json === 'string' ? JSON.parse(json) : json;
      if (!d || d.v !== SAVE_VERSION) return null;
      if (!Array.isArray(d.board) || d.board.length !== CELLS) return null;
      if (!Array.isArray(d.tray) || d.tray.length !== TRAY) return null;
      for (var i = 0; i < CELLS; i++) {
        var v = d.board[i];
        if (!(v === 0 || (v >= 1 && v <= COLOR_COUNT && v === (v | 0)))) return null;
      }
      for (var j = 0; j < TRAY; j++) if (d.tray[j] !== null && !SHAPES[d.tray[j]]) return null;
      var g = new Game(d.seed);
      g.rng = new Rng(1); g.rng.s = d.rng >>> 0;
      g.board = Uint8Array.from(d.board);
      g.tray = d.tray.slice();
      g.score = Math.max(0, d.score | 0);
      g.streak = Math.max(0, d.streak | 0);
      g.since = Math.max(0, d.since | 0);
      g.rescues = Math.max(0, d.rescues | 0);
      g.moves = Math.max(0, d.moves | 0);
      g.linesTotal = Math.max(0, d.lines | 0);
      g.over = !!d.over;
      return g;
    } catch (e) { return null; }
  };

  return {
    SIZE: SIZE, CELLS: CELLS, TRAY: TRAY, COMBO_GRACE: COMBO_GRACE, ALL_CLEAR_BONUS: ALL_CLEAR_BONUS,
    COLOR_COUNT: COLOR_COUNT, SHAPES: SHAPES, SHAPE_IDS: SHAPE_IDS, SMALL_IDS: SMALL_IDS,
    Rng: Rng, Game: Game, emptyBoard: emptyBoard, canPlace: canPlace, canPlaceAnywhere: canPlaceAnywhere,
    placements: placements, previewClears: previewClears, placeAndClear: placeAndClear, fullLines: fullLines,
    lineBase: lineBase, scorePlacement: scorePlacement, nextTray: nextTray, solvable: solvable,
    hasAnyMove: hasAnyMove
  };
});

</script>
<script>
/* Gridbloom UI: canvas rendering, drag, effects, sound, haptics, storage. Rules live in engine.js only. */
(function () {
  'use strict';
  var GB = window.GB;
  var SIZE = GB.SIZE, SHAPES = GB.SHAPES;

  // ---------- storage (every access guarded: private mode / blocked storage must not break play) ----------
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };

  // ---------- skins (own palettes) ----------
  var SKINS = [

    return busy;
  }

  // ---------- optional native host (Android WebView). Everything works without it. ----------
  var native = window.GridbloomNative || null;
  function nat(name, fallback) {
    try { if (native && typeof native[name] === 'function') return native[name](); } catch (e) { /* ignore */ }
    return fallback;
  }
  var pendingRescue = false;
  window.__gbNative = {
    rescueResult: function (granted) {
      pendingRescue = false; $('rescue').disabled = false;
      if (granted && game.rescue()) { sfx.rescue(); buzz(30); persist(); close(dlgOver); fx.trayIn = [now(), now() + 70, now() + 140]; requestDraw(); }
    },
    proceedNewGame: function () { newGame(); }
  };

  // ---------- dialogs ----------
  function dlgOpen() { return dlgOver.classList.contains('show') || dlgSet.classList.contains('show'); }
  function open(d) { d.classList.add('show'); d.removeAttribute('aria-hidden'); var b = d.querySelector('button'); if (b) b.focus(); }
  function close(d) { d.classList.remove('show'); d.setAttribute('aria-hidden', 'true'); canvas.focus(); }

  function showOver() {
    sfx.over(); buzz([40, 60, 40]);
    var isNew = game.score > startBest && game.score > 0;
    $('overScore').textContent = String(game.score);
    $('overBest').textContent = isNew ? 'New best!' : 'Best ' + best;
    $('overBest').className = isNew ? 'badge' : 'muted';
    $('overStats').textContent = game.linesTotal + ' lines · ' + game.moves + ' moves';
    var canRescue = game.canRescue() && (!native || nat('isRewardedReady', false) === true);
    $('rescue').hidden = !canRescue;
    $('rescue').textContent = native ? 'Watch ad for a second chance' : 'Second chance';
    nat('onGameOver');
    open(dlgOver);
  }
  function newGame() {
    clearTimeout(overTimer);
    game = new GB.Game();
    startBest = best; shownScore = 0;
    fx = { pops: [], clears: [], parts: [], floats: [], toasts: [], trayIn: [now(), now() + 70, now() + 140], shake: 0, shakeT: 0 };
    persist(); elLive.textContent = 'New game. Score 0';
    close(dlgOver); close(dlgSet); requestDraw();
  }
  $('again').addEventListener('click', function () {
    if (native && typeof native.beforeNewGame === 'function') { try { native.beforeNewGame(); return; } catch (e) { /* fall through */ } }
    newGame();
  });
  $('rescue').addEventListener('click', function () {
    if (native) {
      if (pendingRescue) return;
      pendingRescue = true; $('rescue').disabled = true;
      try { native.requestRescue(); } catch (e) { window.__gbNative.rescueResult(false); }
      return;
    }
    window.__gbNative.rescueResult(true);
  });
  $('menu').addEventListener('click', function () { renderSettings(); open(dlgSet); });
  $('closeSet').addEventListener('click', function () { close(dlgSet); });
  $('restart').addEventListener('click', newGame);
  $('privacy').hidden = !(native && typeof native.openPrivacy === 'function');
  $('privacy').addEventListener('click', function () { nat('openPrivacy'); });

  var resetArmed = false;
  function renderSettings() {
    $('optSound').setAttribute('aria-checked', String(settings.sound));
    $('optHaptics').setAttribute('aria-checked', String(settings.haptics));
    $('optHaptics').hidden = !navigator.vibrate;
    $('rowHaptics').hidden = !navigator.vibrate;
    var box = $('skins'); box.innerHTML = '';
    SKINS.forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'skin' + (s.id === settings.skin ? ' on' : ''); b.type = 'button';
      b.setAttribute('aria-pressed', String(s.id === settings.skin));
      b.innerHTML = '<span class="sw" style="background:linear-gradient(135deg,' + s.blocks[0] + ',' + s.blocks[3] + ',' + s.blocks[5] + ')"></span>' + s.name;
      b.addEventListener('click', function () { settings.skin = s.id; saveSettings(); applySkin(); renderSettings(); draw(); });
      box.appendChild(b);
    });
    $('resetBest').textContent = resetArmed ? 'Tap again to confirm' : 'Reset best score';
  }
  $('optSound').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); ensureAudio(); renderSettings(); if (settings.sound) sfx.pick(); });
  $('optHaptics').addEventListener('click', function () { settings.haptics = !settings.haptics; saveSettings(); renderSettings(); buzz(20); });
  $('resetBest').addEventListener('click', function () {
    if (!resetArmed) { resetArmed = true; renderSettings(); setTimeout(function () { resetArmed = false; renderSettings(); }, 3000); return; }
    best = 0; startBest = 0; store.del('gb.best'); resetArmed = false; renderSettings(); requestDraw();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (dlgSet.classList.contains('show')) close(dlgSet); }
    else if (e.key === 'm' || e.key === 'M') { settings.sound = !settings.sound; saveSettings(); }
    else if ((e.key === 'n' || e.key === 'N') && !dlgOpen()) { /* no accidental restarts */ }
  });

  function applySkin() {
    var sk = skin(), s = document.documentElement.style;
    s.setProperty('--bg1', sk.bg1); s.setProperty('--bg2', sk.bg2); s.setProperty('--text', sk.text);
    s.setProperty('--dim', sk.dim); s.setProperty('--accent', sk.accent); s.setProperty('--panel', sk.panel);
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', sk.bg2);
  }

  document.addEventListener('visibilitychange', function () { if (document.hidden) persist(); });
  window.addEventListener('pagehide', persist);
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 100); });
  if (window.ResizeObserver) new ResizeObserver(layout).observe(canvas);

  // ---------- test hook (read-only helpers for automated checks) ----------
  window.__gb = { game: function () { return game; }, layout: function () { return L; }, place: place, newGame: newGame };

  applySkin(); layout();
  fx.trayIn = [now(), now() + 70, now() + 140];
  if (game.over) showOver(); else persist();
  requestDraw();
})();

</script>
</body>
</html>
